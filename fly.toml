app = "notes-app-octab"
primary_region = "iad"

[build]

[[services]]
  internal_port = 80
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

  [[services.ports]]
    handlers = ["http"]
    port = 80
  [[services.ports]]
    handlers = ["tls", "http"]
    port = 443

[mounts]
  source = "notes_data"
  destination = "/var/www/html/database"
